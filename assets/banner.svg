<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" role="img" aria-label="CipherBloom Guardian - AI-free security guardian">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0518"/><stop offset="1" stop-color="#150a2e"/>
    </linearGradient>
    <linearGradient id="title" x1="0" x2="1">
      <stop offset="0" stop-color="#ff4fd8"><animate attributeName="stop-color" values="#ff4fd8;#8b5cff;#36e2ff;#ff4fd8" dur="6s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#36e2ff"><animate attributeName="stop-color" values="#36e2ff;#ff4fd8;#8b5cff;#36e2ff" dur="6s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <radialGradient id="blobA"><stop offset="0" stop-color="#8b5cff" stop-opacity=".55"/><stop offset="1" stop-color="#8b5cff" stop-opacity="0"/></radialGradient>
    <radialGradient id="blobB"><stop offset="0" stop-color="#ff4fd8" stop-opacity=".45"/><stop offset="1" stop-color="#ff4fd8" stop-opacity="0"/></radialGradient>
    <radialGradient id="blobC"><stop offset="0" stop-color="#36e2ff" stop-opacity=".35"/><stop offset="1" stop-color="#36e2ff" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="round"><rect width="1200" height="320" rx="28"/></clipPath>
  </defs>
  <style>
    .sub{font:600 21px system-ui,Segoe UI,Roboto,sans-serif;fill:#cbbcf5;letter-spacing:.5px}
    .tag{font:700 15px ui-monospace,Menlo,Consolas,monospace;fill:#9ff0ff}
    .ttl{font:800 76px system-ui,Segoe UI,Roboto,sans-serif;letter-spacing:-2px}
    .pulse{animation:pulse 3s ease-in-out infinite;transform-origin:150px 160px}
    .spin{animation:spin 14s linear infinite;transform-origin:150px 160px}
    .spin2{animation:spin 22s linear infinite reverse;transform-origin:150px 160px}
    .float{animation:float 5s ease-in-out infinite}
    @keyframes pulse{50%{transform:scale(1.07)}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes float{50%{transform:translateY(-8px)}}
    @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
    .r1{animation:rise 1s .2s both}.r2{animation:rise 1s .5s both}.r3{animation:rise 1s .8s both}
  </style>
  <g clip-path="url(#round)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <circle r="260" fill="url(#blobA)"><animate attributeName="cx" values="150;420;150" dur="12s" repeatCount="indefinite"/><animate attributeName="cy" values="60;220;60" dur="12s" repeatCount="indefinite"/></circle>
    <circle r="240" fill="url(#blobB)"><animate attributeName="cx" values="980;760;980" dur="15s" repeatCount="indefinite"/><animate attributeName="cy" values="80;260;80" dur="15s" repeatCount="indefinite"/></circle>
    <circle r="220" fill="url(#blobC)"><animate attributeName="cx" values="600;880;600" dur="18s" repeatCount="indefinite"/><animate attributeName="cy" values="300;120;300" dur="18s" repeatCount="indefinite"/></circle>
    <g fill="#ff4fd8" opacity=".7">
      <circle r="3"><animate attributeName="cx" values="300;340;300" dur="7s" repeatCount="indefinite"/><animate attributeName="cy" values="300;-10" dur="7s" repeatCount="indefinite"/></circle>
      <circle r="2.5" fill="#36e2ff"><animate attributeName="cx" values="620;580;620" dur="9s" repeatCount="indefinite"/><animate attributeName="cy" values="330;-10" dur="9s" repeatCount="indefinite"/></circle>
      <circle r="3.5" fill="#8b5cff"><animate attributeName="cx" values="900;950;900" dur="8s" repeatCount="indefinite"/><animate attributeName="cy" values="340;-10" dur="8s" repeatCount="indefinite"/></circle>
      <circle r="2" fill="#ff4fd8"><animate attributeName="cx" values="1100;1060;1100" dur="10s" repeatCount="indefinite"/><animate attributeName="cy" values="320;-10" dur="10s" repeatCount="indefinite"/></circle>
    </g>
    <g class="float" filter="url(#glow)">
      <g class="spin"><circle cx="150" cy="160" r="104" fill="none" stroke="#8b5cff" stroke-width="2" stroke-dasharray="6 14" opacity=".8"/></g>
      <g class="spin2"><circle cx="150" cy="160" r="122" fill="none" stroke="#36e2ff" stroke-width="1.5" stroke-dasharray="2 12" opacity=".7"/></g>
      <g class="pulse">
        <path d="M150 88 L212 112 V166 C212 206 186 232 150 246 C114 232 88 206 88 166 V112 Z" fill="#1b0f3a" stroke="url(#title)" stroke-width="5"/>
        <g transform="translate(150 164)" fill="url(#title)">
          <ellipse rx="13" ry="34" transform="rotate(0)"/><ellipse rx="13" ry="34" transform="rotate(60)"/><ellipse rx="13" ry="34" transform="rotate(120)"/>
          <circle r="9" fill="#0a0518"/>
        </g>
      </g>
    </g>
    <text x="300" y="150" class="ttl r1" fill="url(#title)">CipherBloom</text>
    <text x="300" y="228" class="ttl r2" fill="#efe9ff" style="font-size:62px">Guardian</text>
    <text x="304" y="268" class="sub r3">Finds leaked keys, risky code &amp; exposed files. Shows the file, line and fix.</text>
    <text x="304" y="296" class="tag r3">no AI   .   no API key   .   no dependencies   .   100% offline</text>
  </g>
  <rect x="1" y="1" width="1198" height="318" rx="27" fill="none" stroke="#3a2370" stroke-width="2"/>
</svg>
